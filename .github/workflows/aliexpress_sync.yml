name: Actualizare Automata Produse AliExpress

on:
  schedule:
    # Rulează automat în fiecare noapte la ora 00:00
    - cron: '0 0 * * *'
  workflow_dispatch: # Îți permite să pornești actualizarea și manual, când vrei tu, printr-un buton

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Copiază codul site-ului tău pe serverul GitHub Actions
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Instalează Python pe server
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instalează librăria pentru AliExpress API
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-aliexpress-api

    # 4. Rulează scriptul Python care descarcă produsele și creează cele 5.000 de pagini
    - name: Run update script
      env:
        ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
        ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      run: python update_products.py

    # 5. Salvează automat toate paginile noi (.html) și sitemap-ul înapoi în GitHub-ul tău
    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add produse/ products.json sitemap.xml
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: S-au generat paginile de produse noi" && git push)
