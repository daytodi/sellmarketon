name: Actualizare Automata Produse AliExpress

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Copiaza codul site-ului
      uses: actions/checkout@v4

    - name: Configureaza Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Ruleaza scriptul de descarcare produse
      env:
        ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
        ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
      run: |
        pip install python-aliexpress-api requests
        python update_products.py

    - name: Trimite produsele noi pe site (Git Push)
      run: |
        git config --global user.name "AliExpress Bot"
        git config --global user.email "bot@github.com"
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizare automata produse din AliExpress API" && git push)
