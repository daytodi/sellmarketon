name: Sincronizare si Generare SEO AliExpress

on:
  schedule:
    - cron: '0 2 */3 * *'
  workflow_dispatch:

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizare Cod Sursă
        uses: actions/checkout@v4

      - name: Configurare Mediu Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalare Dependențe
        run: pip install requests

      - name: Executare Script Python si Generare Pagini
        run: python update_products.py

      - name: Salvare Modificari Direct in Repository
        run: |
          git config --global user.name 'AliExpress SEO Bot'
          git config --global user.email 'seo-bot@sellmarketon.local'
          git add products.json produse/*.html || echo "Nu sunt fisiere noi"
          git commit -m "Actualizare automata catalog" || echo "Fara modificari noi"
          git push || echo "Fortare trecere peste eroare de permisiune"

