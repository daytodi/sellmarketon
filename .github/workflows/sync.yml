name: Sincronizare si Generare SEO AliExpress

on:
  schedule:
    - cron: '0 2 */3 * *' # Rulează la fiecare 3 zile
  workflow_dispatch: # Permite butonul manual

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizare Cod Sursă
        uses: actions/checkout@v4
        with:
          persist-credentials: true # Forțează păstrarea credențialelor de scriere

      - name: Configurare Mediu Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalare Dependențe
        run: pip install requests

      - name: Executare Script Python si Generare Pagini
        env:
          ALI_APP_KEY: "549832"
          ALI_SECRET: ${{ secrets.ALI_SECRET }}
        run: python update_products.py

      # Am înlocuit scriptul manual de Git cu o acțiune nativă stabilă care nu mai dă eroarea 128
      - name: Salvare automata in Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizare automată catalog și pagini de produs SEO"
          file_pattern: 'products.json produse/*.html'
