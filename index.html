<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SellMarketON | Real-Time Cheap Deals</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-red-600 tracking-tight">SellMarket<span class="text-gray-900">ON</span></h1>
            <p class="text-sm text-gray-500">Live Prices & Automated Updates</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-extrabold text-gray-900 sm:text-4xl">Trending Live Products</h2>
            <p class="mt-3 max-w-2xl mx-auto text-xl text-gray-500">Prices are pulled in real-time from the source. No outdated data.</p>
        </div>

        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-center col-span-full text-gray-500 py-10">Fetching live prices directly from AliExpress...</p>
        </div>
    </main>

    <script>
        fetch('products.json')
            .then(response => response.json())
            .then(products => {
                const grid = document.getElementById('products-grid');
                grid.innerHTML = ''; 

                products.forEach(product => {
                    const title = product.productTitle || product.title || 'Trending Item';
                    const image = product.imageUrl || product.image || '';
                    const link = product.promotionUrl || product.affiliateUrl || '#';
                    const cardId = 'price-' + Math.random().toString(36).substr(2, 9);

                    const card = `
                        <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 flex flex-col justify-between border border-gray-100">
                            <div class="relative pt-[100%] bg-gray-50">
                                <img class="absolute inset-0 w-full h-full object-cover p-2" src="${image}" alt="${title}" onerror="this.src='https://placehold.co'">
                            </div>
                            <div class="p-4 flex-grow flex flex-col justify-between">
                                <div>
                                    <h3 class="text-sm font-semibold text-gray-900 line-clamp-2 h-10 mb-2">${title}</h3>
                                    <p id="${cardId}" class="text-lg font-bold text-red-600 mb-4">Loading price...</p>
                                </div>
                                <a href="${link}" target="_blank" rel="noopener noreferrer" class="w-full bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded text-center block transition-colors duration-200">
                                    View Deal Now
                                </a>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;

                    // Extragem pretul live din codul paginii folosind un proxy gratuit
                    fetch('https://allorigins.win' + encodeURIComponent(link))
                        .then(res => { if (res.ok) return res.json(); throw new Error(); })
                        .then(data => {
                            const html = data.contents;
                            const priceRegex = /"actPrice":"([^"]+)"|"formatedAmount":"([^"]+)"/g;
                            const match = priceRegex.exec(html);
                            const priceElement = document.getElementById(cardId);
                            
                            if (match && (match[1] || match[2])) {
                                const livePrice = match[1] || match[2];
                                priceElement.innerText = livePrice.includes('') ? livePrice : '' + livePrice;
                            } else {
                                priceElement.innerText = product.targetAppSalePrice || product.price || 'Check Price';
                            }
                        })
                        .catch(() => {
                            document.getElementById(cardId).innerText = product.targetAppSalePrice || product.price || 'Check Price';
                        });
                });
            });
    </script>
</body>
</html>
